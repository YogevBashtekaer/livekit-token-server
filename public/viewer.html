
<!DOCTYPE html>
<html>
<head>
    <title>LiveKit Unity Stream</title>

    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>

    <style>
        body {
            background: #181818;
            color: white;
            font-family: Arial;
            text-align: center;
        }

        video {
            width: 80%;
            max-width: 1000px;
            background: black;
            margin-top: 20px;
        }

        button {
            padding: 12px 25px;
            cursor: pointer;
        }

        #cameraButtons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 20px;
            flex-wrap: wrap;
        }

        #cameraButtons button {
            padding: 12px 22px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #444;
            color: white;
        }

        #cameraButtons button.active {
            background: #1685ff;
        }

        #qualitySelect {
            padding: 10px 20px;
            border-radius: 5px;
            margin-left: 8px;
            cursor: pointer;
        }

        #videoContainer video {
            width: 80%;
            max-width: 1000px;
        }
    </style>
</head>

<body>

    <h2>Unity LiveKit Stream</h2>

    <button onclick="connectViewer()">Connect Viewer</button>

    <p id="status">Waiting for connection...</p>

    <div id="cameraButtons"></div>

    <div style="margin: 15px 0;">
        <label for="qualitySelect">Stream Quality:</label>

        <select id="qualitySelect">
            <option value="LOW">Low</option>
            <option value="MEDIUM">Medium</option>
            <option value="HIGH" selected>High</option>
            <option value="ULTRA">Ultra</option>
        </select>
    </div>


    <div style="margin: 15px 0;">
    <label for="fpsSelect">Stream FPS:</label>

        <select id="fpsSelect">
            <option value="15">15 FPS</option>
            <option value="24">24 FPS</option>
            <option value="30" selected>30 FPS</option>
            <option value="45">45 FPS</option>
            <option value="60">60 FPS</option>
        </select>
    </div>

    <div id="videoContainer"></div>

    <script>

        let room;

        const cameraPublications = new Map();
        const cameraTracks = new Map();

        let selectedCamera = null;

        // Default Quality
       // let selectedQuality = LivekitClient.VideoQuality.MEDIUM;
       let selectedQuality = "HIGH";

        const videoContainer =
            document.getElementById("videoContainer");

        const cameraButtons =
            document.getElementById("cameraButtons");

        const qualitySelect =
            document.getElementById("qualitySelect");

        const fpsSelect = document.getElementById("fpsSelect");

        // =====================================
        // QUALITY DROPDOWN EVENT
        // =====================================

        qualitySelect.addEventListener("change", function () {

            changeStreamQuality(this.value);

        });

        fpsSelect.addEventListener("change", async function () {

            const fps = parseInt(this.value);

            if (!room || !room.localParticipant) {
                console.error("Viewer is not connected!");
                return;
            }

            const message = {
                type: "SET_FPS",
                fps: fps
            };

            const encoder = new TextEncoder();

            await room.localParticipant.publishData(
                encoder.encode(JSON.stringify(message)),
                {
                    reliable: true,
                    topic: "stream-control"
                }
            );

            console.log("FPS change request sent:", fps);
        });

        // =====================================
        // ADD CAMERA PUBLICATION
        // =====================================

        function addCameraPublication(publication) {

            if (publication.kind !== LivekitClient.Track.Kind.Video)
                return;

            const trackName = publication.trackName;

            if (!trackName || !trackName.startsWith("camera-"))
                return;

            cameraPublications.set(trackName, publication);

            const cameraNumber =
                trackName.replace("camera-", "");

            let button =
                document.getElementById("btn-" + trackName);

            if (!button) {

                button = document.createElement("button");

                button.id = "btn-" + trackName;

                button.textContent = "Camera " + cameraNumber;

                button.onclick = () => selectCamera(trackName);

                cameraButtons.appendChild(button);
            }

            console.log("Camera available:", trackName);

            // Automatically select Camera 1
            if (trackName === "camera-1" && selectedCamera === null) {

                console.log("Auto selecting Camera 1...");

                selectCamera("camera-1");
            }

            console.log(
                "Camera:", trackName,
                "Simulcast:", publication.simulcasted,
                "Dimensions:", publication.dimensions
            );
        }


        // =====================================
        // SELECT CAMERA
        // =====================================

       
// function selectCamera(trackName) {

//     console.log("Requested subscription:", trackName);

//     // Unsubscribe previous camera
//     if (selectedCamera && selectedCamera !== trackName) {

//         const previousPublication =
//             cameraPublications.get(selectedCamera);

//         if (previousPublication) {

//         }

//         "Camera:",
//         trackName
//     );

//     // Subscribe to selected camera

//     console.log("Camera subscription requested:", trackName);

function selectCamera(trackName) {

    console.log("Requested subscription:", trackName);

    if (selectedCamera && selectedCamera !== trackName) {
        const previousPublication =
            cameraPublications.get(selectedCamera);

        if (previousPublication) {
            previousPublication.setSubscribed(false);
        }
    }

    selectedCamera = trackName;

    const publication = cameraPublications.get(trackName);

    if (!publication) {
        console.warn("Publication not found:", trackName);
        return;
    }

    // Subscribe first. Quality will be applied in TrackSubscribed.
    publication.setSubscribed(true);

    console.log("Camera subscription requested:", trackName);
}

function applySelectedQuality(publication) {

    if (!publication || !publication.isSubscribed)
        return;

    if (selectedQuality === "ULTRA") {

        // Request original 1920x1080 dimensions
        publication.setVideoDimensions({
            width: 1920,
            height: 1080
        });

        console.log(
            "ULTRA 1920x1080 requested:",
            publication.trackName
        );

    } else {

        const quality =
            LivekitClient.VideoQuality[selectedQuality];

        publication.setVideoQuality(quality);

        console.log(
            "Quality applied:",
            selectedQuality,
            publication.trackName
        );
    }
}


        // =====================================
        // CHANGE STREAM QUALITY
        // =====================================

        // function changeStreamQuality(quality) {

        //     selectedQuality =
        //         LivekitClient.VideoQuality[quality];

        //     console.log("Selected Quality:", quality);

        //     if (!selectedCamera)
        //         return;

        //     const publication =
        //         cameraPublications.get(selectedCamera);

        //     if (publication && publication.isSubscribed) {

        //         publication.setVideoQuality(selectedQuality);

        //         console.log(
        //             "Quality applied:",
        //             quality,
        //             "Camera:",
        //             selectedCamera
        //         );

        //     }
        // }

        function changeStreamQuality(quality) {

    selectedQuality = quality;

    console.log("Selected Quality:", selectedQuality);

    if (!selectedCamera)
        return;

    const publication =
        cameraPublications.get(selectedCamera);

    if (publication && publication.isSubscribed) {
        applySelectedQuality(publication);
    }
}


        // =====================================
        // DISPLAY CAMERA
        // =====================================

        function displayCamera(track, publication) {

            const trackName = publication.trackName;

            if (trackName !== selectedCamera)
                return;

            videoContainer.innerHTML = "";

            const videoElement = track.attach();

            videoElement.autoplay = true;
            videoElement.playsInline = true;

            videoElement.style.width = "100%";
            videoElement.style.height = "auto";
            videoElement.style.transform = "scaleY(-1)";

            videoContainer.appendChild(videoElement);

            console.log("Displaying:", trackName);
        }


        // =====================================
        // CONNECT VIEWER
        // =====================================

        async function connectViewer() {

            try {

                document.getElementById("status").innerText =
                    "Getting token...";

                const response = await fetch(
                    "/token",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({

                            roomName: "unity-test-room",

                            identity: "browser-viewer-" +
                                Date.now() + "-" +
                                Math.floor(Math.random() * 10000)

                        })
                    }
                );

                if (!response.ok) {

                    throw new Error("Token request failed");

                }

                const data = await response.json();

                room = new LivekitClient.Room();


                // =====================================
                // TRACK PUBLISHED
                // =====================================

                room.on(
                    LivekitClient.RoomEvent.TrackPublished,

                    (publication, participant) => {

                        addCameraPublication(publication);

                    }
                );


                // =====================================
                // TRACK SUBSCRIBED
                // =====================================

                room.on(
                    LivekitClient.RoomEvent.TrackSubscribed,

                    (track, publication, participant) => {

                        if (track.kind !== LivekitClient.Track.Kind.Video)
                            return;

                        cameraTracks.set(
                            publication.trackName,
                            track
                        );

                        console.log(
                            "SUBSCRIBED:",
                            publication.trackName
                        );

                        // Apply currently selected quality
                       if (publication.trackName === selectedCamera) {

                            applySelectedQuality(publication);

                            setTimeout(() => {

                                const settings = track.mediaStreamTrack.getSettings();

                                console.log(
                                    "ACTUAL RECEIVED RESOLUTION:",
                                    publication.trackName,
                                    settings.width + "x" + settings.height
                                );

                            }, 2000);
                        }

                        displayCamera(track, publication);

                    }
                );


                // =====================================
                // TRACK UNSUBSCRIBED
                // =====================================

                room.on(
                    LivekitClient.RoomEvent.TrackUnsubscribed,

                    (track, publication, participant) => {

                        const trackName = publication.trackName;

                        track.detach();

                        cameraTracks.delete(trackName);

                        console.log(
                            "UNSUBSCRIBED:",
                            trackName
                        );

                        if (trackName === selectedCamera) {

                            videoContainer.innerHTML = "";

                        }

                    }
                );


                // =====================================
                // CONNECT WITH AUTO SUBSCRIBE DISABLED
                // =====================================

                await room.connect(
                    data.serverUrl,
                    data.token,
                    {
                        autoSubscribe: false
                    }
                );


                // Get cameras published before browser connected
                room.remoteParticipants.forEach(participant => {

                    participant.trackPublications.forEach(publication => {

                        addCameraPublication(publication);

                    });

                });


                console.log(
                    "Viewer connected with selective subscription!"
                );

                document.getElementById("status").innerText =
                    "Connected! Waiting for cameras...";

                console.log("Browser connected:", room.name);

            }
            catch (error) {

                console.error(error);

                document.getElementById("status").innerText =
                    "Error: " + error.message;

            }
        }

    </script>

</body>
</html>
